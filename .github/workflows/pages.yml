name: Check and publish Music
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify startup and offline navigation
        run: node tests/navigation-redirect.cjs
      - name: Verify library preservation and accepted playback modules
        run: node tests/drive-enable.cjs
      - name: Verify play, pause and skip transitions
        run: node tests/playback-transitions.cjs
      - name: Verify native audio handoff and failure recovery
        run: node tests/audio-handoff.cjs
      - name: Check JavaScript syntax
        run: find dist -name '*.js' -print0 | xargs -0 -n1 node --check
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
